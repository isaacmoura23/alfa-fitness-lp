<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="275 315 520 295" fill="none" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Alfa Fitness — símbolo AF com haltere</title>
